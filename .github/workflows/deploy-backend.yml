name: Deploy Backend

on:
  push:
    branches:
      - develop
    paths:
      - 'backend/**'
  workflow_dispatch:

env:
  JAR_ATUAL: /home/ubuntu/backend-0.0.1-SNAPSHOT.jar
  JAR_NOVO: /home/ubuntu/backend-new.jar
  JAR_ANTERIOR: /home/ubuntu/backend-previous.jar
  CAMINHO_CHAVE_SSH: ~/.ssh/chave-reusehub.pem
  SERVICO: reusehub

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Garantir permissão de execução no mvnw
        run: chmod +x mvnw

      - name: Build do JAR
        run: ./mvnw clean package -DskipTests

      - name: Configurar chave SSH
        working-directory: .
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ${{ env.CAMINHO_CHAVE_SSH }}
          chmod 600 ${{ env.CAMINHO_CHAVE_SSH }}
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Enviar JAR para o EC2
        working-directory: .
        run: |
          scp -i ${{ env.CAMINHO_CHAVE_SSH }} \
            backend/target/backend-0.0.1-SNAPSHOT.jar \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.JAR_NOVO }}

      - name: Fazer backup do JAR atual no EC2
        working-directory: .
        run: |
          ssh -i ${{ env.CAMINHO_CHAVE_SSH }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cp -f ${{ env.JAR_ATUAL }} ${{ env.JAR_ANTERIOR }} 2>/dev/null || true"

      - name: Promover JAR novo para versão ativa
        working-directory: .
        run: |
          ssh -i ${{ env.CAMINHO_CHAVE_SSH }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mv ${{ env.JAR_NOVO }} ${{ env.JAR_ATUAL }}"

      - name: Reiniciar serviço
        working-directory: .
        run: |
          ssh -i ${{ env.CAMINHO_CHAVE_SSH }} \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "sudo systemctl restart ${{ env.SERVICO }}"
