# =====================================================================
# Configuração do Nginx para o backend do ReUseHub.
# Caminho no servidor: /etc/nginx/sites-available/reusehub
# Ativar com: sudo ln -s /etc/nginx/sites-available/reusehub /etc/nginx/sites-enabled/
# Após instalar o Certbot, este arquivo é editado automaticamente
# para incluir os blocos de SSL.
# =====================================================================

# Bloco HTTPS - tráfego real da aplicação
server {
    listen 443 ssl;
    server_name api.reusehub.me;

    # Limite de upload para suportar múltiplas imagens (padrão Nginx: 1MB).
    # Alinhado com spring.servlet.multipart.max-request-size do backend.
    client_max_body_size 60M;

    # Certificados gerenciados pelo Certbot
    ssl_certificate /etc/letsencrypt/live/api.reusehub.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.reusehub.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://localhost:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# Bloco HTTP - apenas redireciona para HTTPS
server {
    listen 80;
    server_name api.reusehub.me;

    if ($host = api.reusehub.me) {
        return 301 https://$host$request_uri;
    }

    return 404;
}
