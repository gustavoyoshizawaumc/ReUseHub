version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reusehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reusehub
      POSTGRES_USER: reusehub
      POSTGRES_PASSWORD: reusehub123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reusehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: reusehub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: reusehub
      MONGO_INITDB_ROOT_PASSWORD: reusehub123
      MONGO_INITDB_DATABASE: reusehub
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: reusehub-frontend
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  postgres_data:
  mongo_data: