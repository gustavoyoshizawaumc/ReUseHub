version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: reusehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reusehub
      POSTGRES_USER: reusehub
      POSTGRES_PASSWORD: reusehub123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reusehub"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7-jammy
    container_name: reusehub-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: reusehub
      MONGO_INITDB_ROOT_PASSWORD: reusehub123
      MONGO_INITDB_DATABASE: reusehub
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: node:22-alpine
    container_name: reusehub-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - WATCHPACK_POLLING=true
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

  #  backend:
#    build: ./backend
#    container_name: reusehub-backend
#    restart: unless-stopped
#    ports:
#      - "8080:8080"
#    environment:
#      - SPRING_DATASOURCE_URL=jdbc:postgresql://reusehub-postgres:5432/reusehub
#      - SPRING_DATASOURCE_USERNAME=reusehub
#      - SPRING_DATASOURCE_PASSWORD=reusehub123
#      - SPRING_DATA_MONGODB_URI=mongodb://reusehub:reusehub123@reusehub-mongo:27017/reusehub?authSource=admin
#    depends_on:
#      postgres:
#        condition: service_healthy
#      mongodb:
#        condition: service_healthy

volumes:
  postgres_data:
  mongo_data: