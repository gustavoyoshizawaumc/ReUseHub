spring:
  application:
    name: reusehub

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 60MB

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/reusehub
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    baseline-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://reusehub:reusehub123@localhost:27017/reusehub?authSource=admin}

  web:
    resources:
      static-locations: classpath:/static/,classpath:/public/
      cache:
        period: 3600

  mvc:
    static-path-pattern: /static/**

  error:
    include-stacktrace: always
    include-message: always
    include-binding-errors: always

app:
  upload:
    dir: uploads

server:
  port: 8080
  servlet:
    context-path: /

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

logging:
  level:
    root: INFO
    com.reusehub: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web: DEBUG
